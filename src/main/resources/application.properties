
# Use Railway's dynamic PORT variable (defaults to 8081 locally)
server.port=${PORT:8081}
server.address=0.0.0.0

# Server Upload Limits
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=500MB

# Clean JDBC URL without embedded user:password@ credentials
spring.datasource.url=jdbc:postgresql://${PGHOST:postgres.railway.internal}:${PGPORT:5432}/${PGDATABASE:railway}?sslmode=disable
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:IzOAiSuhTHwnewiafumfYmrHPXkvyHvs}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.com.stkapi.stk=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=trace

server.error.include-message=always
server.error.include-stacktrace=always

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


app.firebase.config-path=firebase-service-account (2).json